name: Yuborilgan kitoblarni qo'shish

on:
  push:
    branches: ['qolda-*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: qolda
  cancel-in-progress: false

jobs:
  qolda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Kerakli dasturlar
        run: |
          pip install -q pillow pikepdf
          command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Navbatdagi hamma kitoblarni qo'shish
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Kutubxonamiz bot"
          git config user.email "actions@github.com"
          for br in $(git ls-remote --heads origin 'qolda-*' | sed 's#.*refs/heads/##' | sort); do
            echo "== $br"
            rm -rf ../yuk
            git clone -q --depth 1 --branch "$br" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../yuk || continue
            git pull -q --rebase origin main
            python3 qolda.py ../yuk
            git add -A qolda.json covers
            if ! git diff --cached --quiet; then
              git commit -qm "Kitoblar qo'shildi"
              for t in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
            git push -q origin --delete "$br" || true
          done
          python3 qolda.py --qayta
          git add -A qolda.json
          if ! git diff --cached --quiet; then
            git commit -qm "Kitoblar qayta tozalandi"
            for t in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main || true
